services:
  lookupkit:
    build: .
    image: lookupkit:latest
    ports:
      - '8080:8080'
    environment:
      # WebKit, not Chromium: DuckDuckGo 403s headless Chromium and serves
      # WebKit real results from the same IP. See src/fetch/browser.ts.
      LOOKUPKIT_BROWSER: webkit
      LOOKUPKIT_ENGINES: duckduckgo,yahoo
      LOOKUPKIT_MAX_URLS: '5'
      LOOKUPKIT_TOKEN_BUDGET: '200'
      LOOKUPKIT_CONFIDENT_THRESHOLD: '0.5'
      LOOKUPKIT_LOG_LEVEL: info
    # Chromium's default 64MB /dev/shm is not enough for several pages at once
    # and shows up as tabs crashing mid-navigation.
    shm_size: '1gb'
    restart: unless-stopped
